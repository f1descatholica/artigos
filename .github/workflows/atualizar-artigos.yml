name: Atualizar artigos do blog

on:
  schedule:
    # todo dia as 06:00 UTC (~03:00 no horario de Brasilia)
    - cron: "0 6 * * *"
  workflow_dispatch: {}
    # permite tambem clicar em "Run workflow" manualmente na aba Actions

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar script de atualizacao
        run: python scripts/atualizar_artigos.py

      - name: Publicar mudancas (somente se houver algo novo)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados/artigos.json dados/tags-pendentes.json
          if git diff --cached --quiet; then
            echo "Nada novo hoje."
          else
            git commit -m "Atualizacao automatica de artigos ($(date -u +%Y-%m-%d))"
            git push
          fi
